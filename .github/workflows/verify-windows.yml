name: Verify Windows source build

on:
  push:
    branches: [verify/windows-vs2022-00c6642]
    paths:
      - ".github/workflows/verify-windows.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "dep/**"
      - "src/**"

permissions:
  contents: read

jobs:
  vs2022:
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Prepare x64 Boost 1.78.0
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'boost_1_78_0.7z'
          $boost = Join-Path $env:RUNNER_TEMP 'boost_1_78_0'
          curl.exe --fail --location --retry 3 --output $archive https://archives.boost.io/release/1.78.0/source/boost_1_78_0.7z
          if ($LASTEXITCODE -ne 0) { throw 'Boost download failed.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($hash -ne '090cefea470bca990fa3f3ed793d865389426915b37a2a3258524a7258f0790c') { throw 'Boost checksum mismatch.' }

          7z.exe x $archive "-o$env:RUNNER_TEMP" -y -bso0
          if ($LASTEXITCODE -ne 0) { throw 'Boost extraction failed.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 with MSVC was not found.' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          Push-Location $boost
          try {
            cmd.exe /d /c bootstrap.bat
            if ($LASTEXITCODE -ne 0) { throw 'Boost bootstrap failed.' }
            .\b2.exe -j2 toolset=msvc-14.3 address-model=64 link=static runtime-link=shared threading=multi variant=release --layout=versioned --with-system --with-filesystem --with-thread --with-program_options --with-iostreams --with-regex stage
            if ($LASTEXITCODE -ne 0) { throw 'Boost compilation failed.' }
            Move-Item -LiteralPath '.\stage\lib' -Destination '.\lib64-msvc-14.3'
          } finally {
            Pop-Location
          }
          "BOOST_ROOT=$boost" >> $env:GITHUB_ENV

      - name: Configure the clean source
        run: |
          $ErrorActionPreference = 'Stop'
          $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
          $mysql = Split-Path (Split-Path (Get-Command mysql.exe -ErrorAction Stop).Source)
          $mysqlInclude = Join-Path $mysql 'include'
          $mysqlLibrary = Join-Path $mysql 'lib\libmysql.lib'
          if (!(Test-Path (Join-Path $mysqlInclude 'mysql.h')) -or !(Test-Path $mysqlLibrary)) {
            throw "The MySQL installation at $mysql lacks C client headers or libmysql.lib."
          }

          cmake --version
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -DTOOLS=ON "-DOPENSSL_ROOT_DIR=$openssl" "-DMYSQL_INCLUDE_DIR=$mysqlInclude" "-DMYSQL_LIBRARY=$mysqlLibrary"
          if ($LASTEXITCODE -ne 0) { throw 'Felsoria CMake configuration failed.' }

          $manifest = Get-Content 'build\src\tools\map_extractor\FelsoriaDB2Files.txt'
          if ($manifest.Count -ne 604 -or ($manifest | Sort-Object -Unique).Count -ne 604) {
            throw "Expected 604 unique DB2 filenames, got $($manifest.Count)."
          }
          Write-Host "Generated $($manifest.Count) DB2 filenames."

      - name: Compile bnetserver and the extraction tools
        run: |
          cmake --build build --config RelWithDebInfo --parallel 2 --target bnetserver mapextractor vmap4extractor vmap4assembler mmaps_generator
          if ($LASTEXITCODE -ne 0) { throw 'The bnetserver or extractor build failed.' }

      - name: Compile worldserver
        run: |
          cmake --build build --config RelWithDebInfo --parallel 2 --target worldserver
          if ($LASTEXITCODE -ne 0) { throw 'The worldserver build failed.' }

      - name: Verify build outputs
        run: |
          foreach ($exe in 'bnetserver', 'worldserver', 'mapextractor', 'vmap4extractor', 'vmap4assembler', 'mmaps_generator') {
            $path = Join-Path 'build\bin\RelWithDebInfo' "$exe.exe"
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing $path." }
            Get-Item -LiteralPath $path | Select-Object Name, Length
          }
