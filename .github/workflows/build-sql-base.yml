name: Build Felsoria SQL base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_ASSET: Felsoria-Developer-V2-SQL-fc893298792a.zip
      DB_CONTAINER: felsoria-sql-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the source revision is on main
        if: github.event_name != 'pull_request'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify extraction failure reporting and release validation
        run: |
          g++ -std=c++14 -Wall -Wextra -Werror -I dep/CascLib/src .github/scripts/test-db2-extraction.cpp -o "$RUNNER_TEMP/felsoria-db2-test"
          "$RUNNER_TEMP/felsoria-db2-test" "$RUNNER_TEMP/felsoria-db2-fixtures"
          python3 .github/scripts/test-build-sql-base.py
          python3 .github/scripts/test-publish-sql-release.py

      - name: Download the pinned baseline from the single release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/publish-sql-release.py
          --repo "$GITHUB_REPOSITORY" --download-baseline
          --directory "$RUNNER_TEMP/felsoria-base"

      - name: Start isolated MySQL 5.7.44
        run: >-
          docker run -d --name "$DB_CONTAINER" --network none
          -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:5.7.44-oraclelinux7
          --lower-case-table-names=1 --max-allowed-packet=64M

      - name: Build the SQL package
        run: |
          python3 .github/scripts/build-sql-base.py \
            --baseline "$RUNNER_TEMP/felsoria-base/$BASE_ASSET" \
            --updates sql/updates --container "$DB_CONTAINER" --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/felsoria-output/Felsoria-Developer-V2-SQL-${GITHUB_SHA:0:12}.zip"

      - name: Upload the generated SQL package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: felsoria-database
          path: ${{ runner.temp }}/felsoria-output/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Remove the disposable database
        if: always()
        run: |
          if docker container inspect "$DB_CONTAINER" >/dev/null 2>&1; then
            docker rm -f -v "$DB_CONTAINER"
          fi

  windows:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    uses: ./.github/workflows/windows-check.yml

  publish-main:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: felsoria-sql-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: felsoria-database
          path: ${{ runner.temp }}/felsoria-output
      - name: Update the single Felsoria V2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/publish-sql-release.py
          --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --directory "$RUNNER_TEMP/felsoria-output"
